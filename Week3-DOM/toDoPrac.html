<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>todolist</title>
        <style>

        </style>
    </head>

    <body>
        <h1>To Do List</h1>
        <h2>List</h>
        <div id="ListElements">
            <div id = "1" style=" display:flex">
                <h4 id="id1">1. Water plants</h4>
                <button onclick="DeleteItem(1)" > Delete</button>
            </div>
            <div id = "2">
                <h4 id="id2">0. Shop</h4>
                <button onclick="DeleteItem(2)">Delete</butto>
                <button onclick="Update2()"> Start Timer</button>
            </div>
        </div>
            
        <div>
            <input type = "text" placeholder = "Enter you task">
            <button onclick = "AddToDo()" >Add To Do</button>
        </div>


        <script>
            let ptr = 3;
            function DeleteItem(num){
                const ChildItem = document.getElementById(num);
                ChildItem.parentNode.removeChild(ChildItem);
            }
            function AddToDo(){
                const InputVal = document.querySelector("input");
                
                let NewToDo = document.createElement("div");
                NewToDo.setAttribute("id", ptr);
                const Parent = document.querySelector("#ListElements")
                let val = (Parent.children.length+1) + ". " + InputVal.value;
                NewToDo.innerHTML = "<div> <div>" + val+"</div> <button onclick='DeleteItem("+ ptr+")'> Delete </button> </div>";
                Parent.appendChild(NewToDo);
            }

            let cnt = 1;
            function Update2(){
                setTimeout(()=>{
                    document.querySelector("#id2").innerHTML = cnt + ". Shop";
                    cnt++;
                    Update2();
                },1000)
            }
            
        </script>
    </body>
</html>
